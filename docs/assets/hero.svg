<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-labelledby="ecom-hero-title ecom-hero-desc">
  <title id="ecom-hero-title">Ecommerce - Goa v3 Marketplace API</title>
  <desc id="ecom-hero-desc">Hero banner for the Ecommerce Go and Goa v3 marketplace backend service.</desc>
  <defs>
    <marker id="ecom-hero-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00ADD8"/>
    </marker>
    <style>
      .ecom-h-display { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.02em; }
      .ecom-h-sub { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 500; fill: #CBD5E1; }
      .ecom-h-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #38BDF8; }
      .ecom-h-warm { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #FB923C; }
      .ecom-h-chip-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 500; fill: #E2E8F0; }
      .ecom-h-box { fill: none; stroke: #334155; stroke-width: 1.25; }
      .ecom-h-cyan-box { fill: none; stroke: #00ADD8; stroke-width: 1.5; }
      .ecom-h-warm-box { fill: none; stroke: #EA580C; stroke-width: 1.5; }
      .ecom-h-conn { fill: none; stroke: #00ADD8; stroke-width: 1.5; marker-end: url(#ecom-hero-arrow); }
      .ecom-h-pulse { animation: ecomPulse 2.6s ease-in-out infinite; }
      @keyframes ecomPulse {
        0%, 100% { stroke-opacity: 1; }
        50% { stroke-opacity: 0.4; }
      }
      @media (prefers-color-scheme: light) {
        .ecom-h-display { fill: #0F172A; }
        .ecom-h-sub { fill: #475569; }
        .ecom-h-mono { fill: #0284C7; }
        .ecom-h-warm { fill: #C2410C; }
        .ecom-h-chip-txt { fill: #1E293B; }
        .ecom-h-box { stroke: #CBD5E1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ecom-h-pulse { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Left: Typography & Stack Chips -->
  <g transform="translate(24, 34)">
    <rect x="0" y="0" width="166" height="26" rx="6" class="ecom-h-cyan-box"/>
    <text x="12" y="17.5" class="ecom-h-mono">GO 1.22 / GOA v3 DSL</text>

    <text x="0" y="88" class="ecom-h-display">Ecommerce</text>
    <text x="0" y="118" class="ecom-h-sub">Scalable Marketplace API with Goa, PostgreSQL &amp; JWT Auth</text>

    <!-- Stack Chips -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="84" height="30" rx="6" class="ecom-h-box"/>
      <text x="42" y="19.5" text-anchor="middle" class="ecom-h-chip-txt">Go 1.22</text>

      <rect x="94" y="0" width="88" height="30" rx="6" class="ecom-h-box"/>
      <text x="138" y="19.5" text-anchor="middle" class="ecom-h-chip-txt">Goa v3</text>

      <rect x="192" y="0" width="112" height="30" rx="6" class="ecom-h-box"/>
      <text x="248" y="19.5" text-anchor="middle" class="ecom-h-chip-txt">PostgreSQL</text>

      <rect x="314" y="0" width="96" height="30" rx="6" class="ecom-h-box"/>
      <text x="362" y="19.5" text-anchor="middle" class="ecom-h-chip-txt">JWT Auth</text>

      <rect x="420" y="0" width="124" height="30" rx="6" class="ecom-h-box"/>
      <text x="482" y="19.5" text-anchor="middle" class="ecom-h-chip-txt">OpenAPI / Redoc</text>
    </g>
  </g>

  <!-- Right: Service Flow Motif -->
  <g transform="translate(610, 32)">
    <rect x="12" y="8" width="244" height="38" rx="6" class="ecom-h-cyan-box ecom-h-pulse"/>
    <text x="134" y="31.5" text-anchor="middle" class="ecom-h-mono">HTTP :8000  |  JWT Middleware</text>

    <line x1="134" y1="46" x2="134" y2="70" class="ecom-h-conn"/>

    <rect x="12" y="72" width="114" height="44" rx="6" class="ecom-h-box"/>
    <text x="69" y="98.5" text-anchor="middle" class="ecom-h-chip-txt">/users &amp; /login</text>

    <rect x="142" y="72" width="114" height="44" rx="6" class="ecom-h-box"/>
    <text x="199" y="98.5" text-anchor="middle" class="ecom-h-chip-txt">/products</text>

    <rect x="12" y="128" width="114" height="44" rx="6" class="ecom-h-box"/>
    <text x="69" y="154.5" text-anchor="middle" class="ecom-h-chip-txt">/cart/item</text>

    <rect x="142" y="128" width="114" height="44" rx="6" class="ecom-h-warm-box"/>
    <text x="199" y="154.5" text-anchor="middle" class="ecom-h-warm">/orders</text>

    <rect x="12" y="186" width="244" height="32" rx="6" class="ecom-h-box"/>
    <text x="134" y="206.5" text-anchor="middle" class="ecom-h-chip-txt">PostgreSQL  (database/sql + pq)</text>
  </g>
</svg>
