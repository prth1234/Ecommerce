<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" role="img" aria-labelledby="ecom-arch-title ecom-arch-desc">
  <title id="ecom-arch-title">Ecommerce Service Architecture</title>
  <desc id="ecom-arch-desc">Request flow from HTTP clients and store-cli through JWTAuthMiddleware, Goa generated endpoints, storesrvc business logic, and PostgreSQL.</desc>
  <defs>
    <marker id="ecom-arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00ADD8"/>
    </marker>
    <marker id="ecom-arch-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <style>
      .ecom-a-title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #F8FAFC; }
      .ecom-a-body { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #CBD5E1; }
      .ecom-a-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; fill: #38BDF8; }
      .ecom-a-warm { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; fill: #FB923C; }
      .ecom-a-box { fill: none; stroke: #334155; stroke-width: 1.25; }
      .ecom-a-conn { fill: none; stroke: #00ADD8; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#ecom-arch-arrow); animation: ecomArchFlow 14s linear infinite; }
      .ecom-a-conn-warm { fill: none; stroke: #EA580C; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#ecom-arch-arrow-warm); animation: ecomArchFlow 14s linear infinite; }
      .ecom-a-sig-cyan { fill: #38BDF8; }
      .ecom-a-sig-warm { fill: #FB923C; }

      /* Synchronized 8s cycle across 4 stages + bottom codegen strip */
      .ecom-a-n1-box { animation: ecomArchCyanBox 8s ease-in-out infinite 0s; }
      .ecom-a-n2-box { animation: ecomArchCyanBox 8s ease-in-out infinite 2s; }
      .ecom-a-n3-box { animation: ecomArchCyanBox 8s ease-in-out infinite 4s; }
      .ecom-a-n4-box { animation: ecomArchWarmBox 8s ease-in-out infinite 6s; }
      .ecom-a-ng-box { animation: ecomArchCyanBox 8s ease-in-out infinite 3s; }

      .ecom-a-n1-title { animation: ecomArchCyanTitle 8s ease-in-out infinite 0s; }
      .ecom-a-n2-title { animation: ecomArchCyanTitle 8s ease-in-out infinite 2s; }
      .ecom-a-n3-title { animation: ecomArchCyanTitle 8s ease-in-out infinite 4s; }
      .ecom-a-n4-title { animation: ecomArchWarmTitle 8s ease-in-out infinite 6s; }
      .ecom-a-ng-title { animation: ecomArchCyanTitle 8s ease-in-out infinite 3s; }

      @keyframes ecomArchFlow { to { stroke-dashoffset: -180; } }
      @keyframes ecomArchCyanBox {
        0%, 32%, 100% { stroke: #334155; stroke-width: 1.25; }
        8%, 22% { stroke: #00ADD8; stroke-width: 1.9; }
      }
      @keyframes ecomArchWarmBox {
        0%, 32%, 100% { stroke: #334155; stroke-width: 1.25; }
        8%, 22% { stroke: #EA580C; stroke-width: 1.9; }
      }
      @keyframes ecomArchCyanTitle {
        0%, 32%, 100% { fill: #F8FAFC; }
        8%, 22% { fill: #38BDF8; }
      }
      @keyframes ecomArchWarmTitle {
        0%, 32%, 100% { fill: #F8FAFC; }
        8%, 22% { fill: #FB923C; }
      }

      @media (prefers-color-scheme: light) {
        .ecom-a-title { fill: #0F172A; }
        .ecom-a-body { fill: #475569; }
        .ecom-a-mono { fill: #0284C7; }
        .ecom-a-warm { fill: #C2410C; }
        .ecom-a-box { stroke: #CBD5E1; }
        .ecom-a-sig-cyan { fill: #0284C7; }
        .ecom-a-sig-warm { fill: #C2410C; }
        .ecom-a-n1-box, .ecom-a-n2-box, .ecom-a-n3-box, .ecom-a-ng-box { animation-name: ecomArchCyanBoxLight; }
        .ecom-a-n4-box { animation-name: ecomArchWarmBoxLight; }
        .ecom-a-n1-title, .ecom-a-n2-title, .ecom-a-n3-title, .ecom-a-ng-title { animation-name: ecomArchCyanTitleLight; }
        .ecom-a-n4-title { animation-name: ecomArchWarmTitleLight; }
      }
      @keyframes ecomArchCyanBoxLight {
        0%, 32%, 100% { stroke: #CBD5E1; stroke-width: 1.25; }
        8%, 22% { stroke: #0284C7; stroke-width: 1.9; }
      }
      @keyframes ecomArchWarmBoxLight {
        0%, 32%, 100% { stroke: #CBD5E1; stroke-width: 1.25; }
        8%, 22% { stroke: #C2410C; stroke-width: 1.9; }
      }
      @keyframes ecomArchCyanTitleLight {
        0%, 32%, 100% { fill: #0F172A; }
        8%, 22% { fill: #0284C7; }
      }
      @keyframes ecomArchWarmTitleLight {
        0%, 32%, 100% { fill: #0F172A; }
        8%, 22% { fill: #C2410C; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ecom-a-conn, .ecom-a-conn-warm,
        .ecom-a-n1-box, .ecom-a-n2-box, .ecom-a-n3-box, .ecom-a-n4-box, .ecom-a-ng-box,
        .ecom-a-n1-title, .ecom-a-n2-title, .ecom-a-n3-title, .ecom-a-n4-title, .ecom-a-ng-title {
          animation: none !important;
        }
        .ecom-a-conn, .ecom-a-conn-warm { stroke-dasharray: none; }
        .ecom-a-sig-cyan, .ecom-a-sig-warm { display: none; }
      }
    </style>
  </defs>

  <!-- Stage 1: Clients -->
  <g transform="translate(20, 24)">
    <rect x="0" y="0" width="168" height="148" rx="6" class="ecom-a-box ecom-a-n1-box"/>
    <text x="14" y="28" class="ecom-a-title ecom-a-n1-title">Clients</text>
    <text x="14" y="50" class="ecom-a-mono">HTTP / CLI</text>
    <text x="14" y="78" class="ecom-a-body">cmd/store-cli</text>
    <text x="14" y="98" class="ecom-a-body">Redoc /docs/</text>
    <text x="14" y="118" class="ecom-a-body">OpenAPI v2 &amp; v3</text>
  </g>

  <line x1="188" y1="98" x2="222" y2="98" class="ecom-a-conn"/>
  <circle r="3.5" class="ecom-a-sig-cyan">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 188 98 L 222 98" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"/>
  </circle>

  <!-- Stage 2: Transport & Middleware -->
  <g transform="translate(224, 24)">
    <rect x="0" y="0" width="204" height="148" rx="6" class="ecom-a-box ecom-a-n2-box"/>
    <text x="14" y="28" class="ecom-a-title ecom-a-n2-title">Transport Layer</text>
    <text x="14" y="50" class="ecom-a-mono">cmd/store + middleware</text>
    <text x="14" y="78" class="ecom-a-body">Goa HTTP Mux (:8000)</text>
    <text x="14" y="98" class="ecom-a-body">RequestID &amp; Logger</text>
    <text x="14" y="118" class="ecom-a-body">JWTAuthMiddleware (HS256)</text>
  </g>

  <line x1="428" y1="98" x2="462" y2="98" class="ecom-a-conn"/>
  <circle r="3.5" class="ecom-a-sig-cyan">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 428 98 L 462 98" keyPoints="0;0;1;1" keyTimes="0;0.25;0.5;1" calcMode="linear"/>
  </circle>

  <!-- Stage 3: Service & Business Logic -->
  <g transform="translate(464, 24)">
    <rect x="0" y="0" width="214" height="148" rx="6" class="ecom-a-box ecom-a-n3-box"/>
    <text x="14" y="28" class="ecom-a-title ecom-a-n3-title">Store Service</text>
    <text x="14" y="50" class="ecom-a-mono">store.go (storesrvc)</text>
    <text x="14" y="78" class="ecom-a-body">Users &amp; bcrypt Auth</text>
    <text x="14" y="98" class="ecom-a-body">Products &amp; Price Filters</text>
    <text x="14" y="118" class="ecom-a-body">Cart &amp; Order Lifecycle</text>
  </g>

  <line x1="678" y1="98" x2="712" y2="98" class="ecom-a-conn-warm"/>
  <circle r="3.5" class="ecom-a-sig-warm">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 678 98 L 712 98" keyPoints="0;0;1;1" keyTimes="0;0.5;0.75;1" calcMode="linear"/>
  </circle>

  <!-- Stage 4: Database -->
  <g transform="translate(714, 24)">
    <rect x="0" y="0" width="166" height="148" rx="6" class="ecom-a-box ecom-a-n4-box"/>
    <text x="14" y="28" class="ecom-a-title ecom-a-n4-title">PostgreSQL</text>
    <text x="14" y="50" class="ecom-a-warm">db.go (lib/pq)</text>
    <text x="14" y="78" class="ecom-a-body">users &amp; products</text>
    <text x="14" y="98" class="ecom-a-body">carts &amp; orders</text>
    <text x="14" y="118" class="ecom-a-body">TX &amp; go-sqlmock</text>
  </g>

  <!-- Bottom: Goa DSL Codegen Strip -->
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="860" height="64" rx="6" class="ecom-a-box ecom-a-ng-box"/>
    <text x="16" y="26" class="ecom-a-title ecom-a-ng-title">Goa v3 DSL Code Generation</text>
    <text x="16" y="48" class="ecom-a-mono">design/design.go + design/type.go  --&gt;  gen/store/{service,endpoints,client}.go + gen/http/openapi3.{json,yaml}</text>
  </g>
</svg>
